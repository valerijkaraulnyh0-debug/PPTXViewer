name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Buildozer Environment
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          buildozer android debug || true

      - name: Accept Android Licenses
        run: |
          SDK_ROOT="\$HOME/.buildozer/android/platform/android-sdk"
          SDK_MANAGER="\$SDK_ROOT/tools/bin/sdkmanager"

          if [ ! -d "\$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found."
            ls -la "\$HOME/.buildozer/android/platform/" 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "\$SDK_MANAGER" ]; then
            if [ -d "\$SDK_ROOT/cmdline-tools/latest/bin" ]; then
              SDK_MANAGER="\$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              echo "Using new SDK structure: \$SDK_MANAGER"
            else
              echo "ERROR: sdkmanager not found."
              ls -la "\$SDK_ROOT" 2>/dev/null || true
              exit 1
            fi
          fi

          echo "Accepting licenses..."
          yes | "\$SDK_MANAGER" --licenses

          if [ \$? -eq 0 ]; then
            echo "All licenses accepted successfully."
          else
            echo "Failed to accept licenses."
            exit 1
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk

