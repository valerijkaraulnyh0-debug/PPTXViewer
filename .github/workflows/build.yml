name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SDK and NDK
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          buildozer android debug || true

      - name: Accept Android Licenses
        run: |
          SDK_PATH="\$HOME/.buildozer/android/platform/android-sdk"
          SDK_MANAGER="\$SDK_PATH/tools/bin/sdkmanager"
          
          if [ -f "\$SDK_MANAGER" ]; then
            echo "Found sdkmanager at: \$SDK_MANAGER"
            echo "Accepting licenses..."
            yes | "\$SDK_MANAGER" --licenses
            echo "Licenses accepted."
          else
            echo "ERROR: sdkmanager not found at \$SDK_MANAGER"
            ls -la "\$SDK_PATH" || true
            exit 1
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
