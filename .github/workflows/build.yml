name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Buildozer and Download Tools
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          timeout 15m buildozer android debug || true
          
          SDK_MANAGER_PATH="\$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          for i in {1..12}; do
            if [ -f "\$SDK_MANAGER_PATH" ]; then
              echo "SDK Manager found."
              break
            fi
            echo "Waiting for SDK Manager to be extracted... (\$i/12)"
            sleep 10
          done

      - name: Accept Android Licenses
        run: |
          SDK_PATH="\$HOME/.buildozer/android/platform/android-sdk"
          SDK_MANAGER="\$SDK_PATH/tools/bin/sdkmanager"
          
          if [ -f "\$SDK_MANAGER" ]; then
            echo "Found sdkmanager at: \$SDK_MANAGER"
            echo "Accepting licenses..."
            yes | "\$SDK_MANAGER" --licenses
            echo "Licenses accepted."
          else
            echo "ERROR: sdkmanager still not found!"
            ls -la "\$SDK_PATH" 2>/dev/null || echo "SDK directory does not exist"
            exit 1
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
