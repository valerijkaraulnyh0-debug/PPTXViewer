name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Buildozer Environment (Download SDK/NDK)
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          timeout 20m buildozer android debug || true

          SDK_PATH="\$HOME/.buildozer/android/platform/android-sdk"
          if [ ! -d "\$SDK_PATH" ]; then
            echo "ERROR: Android SDK directory was NOT created!"
            ls -la "\$HOME/.buildozer/android/platform/" 2>/dev/null || echo "Platform folder missing"
            exit 1
          else
            echo "SUCCESS: Android SDK directory found at \$SDK_PATH"
            ls -la "\$SDK_PATH"
          fi

      - name: Accept Android Licenses
        run: |
          SDK_ROOT="\$HOME/.buildozer/android/platform/android-sdk"
          SDK_MANAGER=""

          if [ -f "\$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDK_MANAGER="\$SDK_ROOT/tools/bin/sdkmanager"
            echo "Using sdkmanager from tools/bin"
          elif [ -d "\$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            SDK_MANAGER="\$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            echo "Using sdkmanager from cmdline-tools/latest/bin"
          else
            echo "ERROR: sdkmanager not found in either location!"
            find "\$SDK_ROOT" -type d 2>/dev/null | head -n 20
            exit 1
          fi

          echo "Accepting licenses..."
          yes | "\$SDK_MANAGER" --licenses

          if [ \$? -eq 0 ]; then
            echo "All licenses accepted successfully."
          else
            echo "Failed to accept licenses."
            exit 1
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
